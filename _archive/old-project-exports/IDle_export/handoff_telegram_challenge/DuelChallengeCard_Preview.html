<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Duel Challenge Card — Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #06080a; font-family: 'Share Tech Mono', monospace; color: #c4a65d; min-height: 100vh; }
    .page { max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; }
    .header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid rgba(196,166,93,0.2); padding-bottom: 14px; margin-bottom: 28px; }
    .h1 { font-family: 'Black Ops One', sans-serif; font-size: 22px; letter-spacing: 0.1em; color: #fff8e8; }
    .h1 b { color: #ff7a1a; }
    .meta { font-size: 11px; letter-spacing: 0.3em; color: rgba(196,166,93,0.7); }
    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      align-items: start;
    }
    .stage {
      background:
        linear-gradient(45deg, rgba(255,255,255,0.015) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.015) 75%),
        linear-gradient(45deg, rgba(255,255,255,0.015) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.015) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
      border: 1px solid rgba(196,166,93,0.2);
      padding: 32px;
      display: flex; justify-content: center; align-items: center;
    }
    .stage-frame {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 1 / 1;
      position: relative;
      box-shadow: 0 24px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(196,166,93,0.2);
    }
    .stage-inner { position: absolute; inset: 0; transform-origin: top left; width: 1080px; height: 1080px; }

    .controls { background: rgba(196,166,93,0.04); border: 1px solid rgba(196,166,93,0.25); padding: 22px; }
    .controls h2 { margin: 0 0 14px; font-family: 'Black Ops One', sans-serif; font-size: 16px; letter-spacing: 0.15em; color: #ff7a1a; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 10px; letter-spacing: 0.25em; color: rgba(196,166,93,0.7); text-transform: uppercase; }
    .field input { background: #0a0d07; border: 1px solid rgba(196,166,93,0.3); color: #fff8e8; padding: 8px 10px; font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 0.05em; }
    .field input:focus { outline: none; border-color: #ff7a1a; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .note { margin-top: 18px; padding: 14px; background: rgba(255,122,26,0.06); border: 1px dashed rgba(255,122,26,0.4); font-size: 12px; line-height: 1.6; color: rgba(244,231,200,0.85); }
    .note b { color: #ff7a1a; letter-spacing: 0.2em; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="h1">SOL<b>SHOT</b> · DUEL CHALLENGE CARD <span style="opacity:0.5;font-size:13px">v1.0 — Telegram OPEN state</span></div>
      <div class="meta">1080 × 1080 · DIRECT CALL-OUT · SATORI-READY</div>
    </div>

    <div class="grid">
      <div class="stage">
        <div id="frame" class="stage-frame">
          <div id="inner" class="stage-inner">
            <div id="root" style="width:1080px;height:1080px;"></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <h2>LIVE PROPS</h2>
        <div class="field">
          <label>Challenger callsign</label>
          <input id="ch_callsign" value="GRIZZLY-07" />
        </div>
        <div class="row2">
          <div class="field"><label>Initials</label><input id="ch_initials" value="G7" /></div>
          <div class="field"><label>Rank</label><input id="ch_rank" value="MAJOR" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Record</label><input id="ch_record" value="47W · 12L" /></div>
          <div class="field"><label>Win rate %</label><input id="ch_wr" value="79" /></div>
        </div>
        <div class="field">
          <label>Opponent callsign</label>
          <input id="op_callsign" value="VIPER-12" />
        </div>
        <div class="row2">
          <div class="field"><label>Initials</label><input id="op_initials" value="V12" /></div>
          <div class="field"><label>Handle</label><input id="op_handle" value="@viper12" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Wager</label><input id="wager_amt" value="0.5" /></div>
          <div class="field"><label>Token</label><input id="wager_tok" value="SOL" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Format</label><input id="format" value="BO3" /></div>
          <div class="field"><label>Match ID</label><input id="match_id" value="CH-#0A3F7" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Short URL</label><input id="short_url" value="solshot.gg/c/0A3F7" /></div>
          <div class="field"><label>Expires in</label><input id="expires" value="24:00:00" /></div>
        </div>
        <div class="note">
          <b>NOTE:</b> Edits update the card live. The component file (<code style="color:#fff8e8">DuelChallengeCard.jsx</code>) is identical here and on the server — JSX renders both in the browser DOM and in Satori on Node.
        </div>
      </div>
    </div>
  </div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useRef, useState } = React;

    /* ── Inline copy of DuelChallengeCard.jsx ── */
    const C = {
      bgDeep:'#0e1209', bgDeeper:'#0a0d07', ink:'#06080a',
      accent:'#ff7a1a', accentDeep:'#c44d12', accentSoft:'#ffb05a',
      blood:'#a83a1f', bloodDeep:'#5a1e0a',
      bone:'#fff8e8', bonePale:'#f4e7c8', olive:'#c4a65d',
    };
    const F = {
      display:"'Black Ops One', sans-serif",
      mono:"'Share Tech Mono', monospace",
    };

    function DuelSide({ label, initials, callsign, subtitleColor, subtitleText, metaText, tone }) {
      const ringColor = tone === 'hot' ? C.accentSoft : C.bonePale;
      const initialsColor = tone === 'hot' ? C.accentSoft : C.bonePale;
      return (
        <div style={{ flexGrow:1, flexBasis:0, display:'flex', flexDirection:'column', alignItems:'center', padding:'0 10px' }}>
          <div style={{ fontFamily:F.mono, fontSize:13, letterSpacing:'0.4em', color:'rgba(255,248,232,0.7)', marginBottom:10 }}>{label}</div>
          <div style={{ width:140, height:140, background:C.ink, border:`4px solid ${ringColor}`, display:'flex', alignItems:'center', justifyContent:'center' }}>
            <div style={{ fontFamily:F.display, fontSize:56, color:initialsColor, letterSpacing:'0.05em' }}>{initials}</div>
          </div>
          <div style={{ marginTop:18, maxWidth:'100%', height:50, display:'flex', justifyContent:'center', overflow:'hidden' }}>
            <div style={{ fontFamily:F.display, fontSize:52, color:C.bone, lineHeight:1, letterSpacing:'0.02em', textShadow:'0 4px 0 rgba(0,0,0,0.4)', whiteSpace:'nowrap' }}>{callsign}</div>
          </div>
          <div style={{ fontFamily:F.mono, fontSize:13, letterSpacing:'0.3em', color:subtitleColor, marginTop:12 }}>{subtitleText}</div>
          <div style={{ fontFamily:F.mono, fontSize:12, letterSpacing:'0.25em', color:'rgba(255,248,232,0.6)', marginTop:4 }}>{metaText}</div>
        </div>
      );
    }

    function DuelChallengeCard({ challenger, opponent, wager, format, matchId, shortUrl, expiresIn }) {
      const W = 1080, H = 1080;
      return (
        <div style={{ width:W, height:H, position:'relative', background:C.bgDeep, display:'flex' }}>
          <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`} style={{ position:'absolute', left:0, top:0 }}>
            <defs>
              <pattern id="duel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(196,166,93,0.06)" strokeWidth="1" />
              </pattern>
              <linearGradient id="duel-blade-l" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor={C.accent} />
                <stop offset="100%" stopColor={C.accentDeep} />
              </linearGradient>
              <linearGradient id="duel-blade-r" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stopColor={C.blood} />
                <stop offset="100%" stopColor={C.bloodDeep} />
              </linearGradient>
            </defs>
            <rect width={W} height={H} fill="url(#duel-grid)" />
            <polygon points={`0,0 ${W*0.5-20},0 ${W*0.5-60},${H} 0,${H}`} fill="url(#duel-blade-l)" opacity="0.92" />
            <polygon points={`${W*0.5+20},0 ${W},0 ${W},${H} ${W*0.5+60},${H}`} fill="url(#duel-blade-r)" opacity="0.78" />
          </svg>

          <div style={{ position:'absolute', left:56, right:56, top:36, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ display:'flex', fontFamily:F.display, fontSize:40, color:C.bone, letterSpacing:'0.08em' }}>
              <span>SOL</span><span style={{ color:C.accentSoft }}>SHOT</span>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:10, background:'rgba(10,13,7,0.7)', border:'1px solid rgba(255,176,90,0.5)', padding:'6px 14px' }}>
              <div style={{ width:8, height:8, background:C.accentSoft, borderRadius:999 }} />
              <div style={{ fontFamily:F.mono, fontSize:14, letterSpacing:'0.3em', color:C.bonePale }}>OPEN CHALLENGE</div>
            </div>
          </div>

          <div style={{ position:'absolute', left:56, top:92, fontFamily:F.mono, fontSize:11, letterSpacing:'0.3em', color:'rgba(196,166,93,0.6)' }}>{matchId}</div>

          <div style={{ position:'absolute', left:0, right:0, top:130, display:'flex', justifyContent:'center', fontFamily:F.mono, fontSize:16, letterSpacing:'0.5em', color:'rgba(255,248,232,0.6)' }}>
            ━━━ DIRECT CALL-OUT ━━━
          </div>

          <div style={{ position:'absolute', left:30, right:30, top:220, display:'flex', flexDirection:'row', alignItems:'center' }}>
            <DuelSide label="CHALLENGER" initials={challenger.initials} callsign={challenger.callsign} subtitleColor={C.accentSoft} subtitleText={challenger.rank} metaText={`${challenger.record} · ${challenger.winRate}% WR`} tone="hot" />
            <div style={{ width:160, display:'flex', justifyContent:'center', alignItems:'center' }}>
              <div style={{ fontFamily:F.display, fontSize:160, color:C.bone, lineHeight:0.85, letterSpacing:'-0.02em', textShadow:`0 0 40px ${C.accent}, 4px 4px 0 ${C.ink}`, transform:'rotate(-3deg)', display:'flex' }}>VS</div>
            </div>
            <DuelSide label="SUMMONED" initials={opponent.initials} callsign={opponent.callsign} subtitleColor={C.bonePale} subtitleText={opponent.handle} metaText="DECLINE = COWARD" tone="cold" />
          </div>

          <div style={{ position:'absolute', left:56, right:56, bottom:168, display:'flex', flexDirection:'row', background:C.ink, border:`2px solid ${C.accentSoft}`, padding:'20px 28px' }}>
            <div style={{ display:'flex', flexDirection:'column', flexGrow:1 }}>
              <div style={{ fontFamily:F.mono, fontSize:12, letterSpacing:'0.3em', color:C.olive, marginBottom:4 }}>WAGER</div>
              <div style={{ display:'flex', alignItems:'baseline', fontFamily:F.display, fontSize:56, color:C.accentSoft, lineHeight:1 }}>
                <span>{wager.amount}</span>
                <span style={{ color:C.bone, fontSize:32, marginLeft:14 }}>{wager.token}</span>
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', flexGrow:1, borderLeft:'1px solid rgba(196,166,93,0.3)', paddingLeft:28 }}>
              <div style={{ fontFamily:F.mono, fontSize:12, letterSpacing:'0.3em', color:C.olive, marginBottom:4 }}>FORMAT</div>
              <div style={{ display:'flex', alignItems:'baseline', fontFamily:F.display, fontSize:56, color:C.bone, lineHeight:1 }}>
                <span>{format}</span>
                <span style={{ fontSize:22, color:C.olive, letterSpacing:'0.1em', marginLeft:14 }}>· FIRST TO 2</span>
              </div>
            </div>
          </div>

          <div style={{ position:'absolute', left:0, right:0, bottom:0, height:100, display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 56px', background:C.bgDeeper, borderTop:`2px solid ${C.accentSoft}` }}>
            <div style={{ display:'flex', flexDirection:'column' }}>
              <div style={{ fontFamily:F.display, fontSize:24, color:C.accentSoft, letterSpacing:'0.15em' }}>▸ ACCEPT NOW</div>
              <div style={{ fontFamily:F.mono, fontSize:14, letterSpacing:'0.3em', color:C.olive, marginTop:2 }}>{shortUrl}</div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end' }}>
              <div style={{ fontFamily:F.mono, fontSize:12, letterSpacing:'0.3em', color:C.olive }}>EXPIRES IN</div>
              <div style={{ fontFamily:F.display, fontSize:28, color:C.bone, letterSpacing:'0.05em' }}>{expiresIn}</div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [props, setProps] = useState({
        challenger: { callsign:'GRIZZLY-07', initials:'G7', rank:'MAJOR', record:'47W · 12L', winRate:79 },
        opponent: { callsign:'VIPER-12', initials:'V12', handle:'@viper12' },
        wager: { amount:0.5, token:'SOL' },
        format:'BO3', matchId:'CH-#0A3F7', shortUrl:'solshot.gg/c/0A3F7', expiresIn:'24:00:00',
      });

      useEffect(() => {
        const fit = () => {
          const fr = document.getElementById('frame');
          const inner = document.getElementById('inner');
          if (!fr || !inner) return;
          const scale = fr.clientWidth / 1080;
          inner.style.transform = `scale(${scale})`;
        };
        fit();
        window.addEventListener('resize', fit);

        const wire = (id, cb) => document.getElementById(id).addEventListener('input', e => cb(e.target.value));
        wire('ch_callsign', v => setProps(p => ({ ...p, challenger: { ...p.challenger, callsign: v }})));
        wire('ch_initials', v => setProps(p => ({ ...p, challenger: { ...p.challenger, initials: v }})));
        wire('ch_rank', v => setProps(p => ({ ...p, challenger: { ...p.challenger, rank: v }})));
        wire('ch_record', v => setProps(p => ({ ...p, challenger: { ...p.challenger, record: v }})));
        wire('ch_wr', v => setProps(p => ({ ...p, challenger: { ...p.challenger, winRate: Number(v) || 0 }})));
        wire('op_callsign', v => setProps(p => ({ ...p, opponent: { ...p.opponent, callsign: v }})));
        wire('op_initials', v => setProps(p => ({ ...p, opponent: { ...p.opponent, initials: v }})));
        wire('op_handle', v => setProps(p => ({ ...p, opponent: { ...p.opponent, handle: v }})));
        wire('wager_amt', v => setProps(p => ({ ...p, wager: { ...p.wager, amount: Number(v) || 0 }})));
        wire('wager_tok', v => setProps(p => ({ ...p, wager: { ...p.wager, token: v }})));
        wire('format', v => setProps(p => ({ ...p, format: v })));
        wire('match_id', v => setProps(p => ({ ...p, matchId: v })));
        wire('short_url', v => setProps(p => ({ ...p, shortUrl: v })));
        wire('expires', v => setProps(p => ({ ...p, expiresIn: v })));

        return () => window.removeEventListener('resize', fit);
      }, []);

      return <DuelChallengeCard {...props} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
