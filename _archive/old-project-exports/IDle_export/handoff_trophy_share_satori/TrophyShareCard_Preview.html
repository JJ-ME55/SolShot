<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Trophy Share Card — Satori Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body { margin: 0; padding: 0; background: #06080a; font-family: 'Share Tech Mono', monospace; color: #c4a65d; min-height: 100vh; }
    .page { max-width: 1320px; margin: 0 auto; padding: 32px 24px 80px; }
    .header { display: flex; align-items: baseline; justify-content: space-between; gap: 24px; flex-wrap: wrap; border-bottom: 1px solid rgba(196,166,93,0.2); padding-bottom: 14px; margin-bottom: 28px; }
    .h1 { font-family: 'Black Ops One', sans-serif; font-size: 22px; letter-spacing: 0.1em; color: #fff8e8; }
    .h1 b { color: #ff7a1a; }
    .meta { font-size: 11px; letter-spacing: 0.3em; color: rgba(196,166,93,0.7); }
    .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; align-items: start; }
    .stage {
      background:
        linear-gradient(45deg, rgba(255,255,255,0.015) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.015) 75%),
        linear-gradient(45deg, rgba(255,255,255,0.015) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.015) 75%);
      background-size: 16px 16px; background-position: 0 0, 8px 8px;
      border: 1px solid rgba(196,166,93,0.2);
      padding: 32px;
      display: flex; justify-content: center; align-items: center;
    }
    .stage-frame {
      width: 100%; max-width: 800px;
      aspect-ratio: 1080 / 608;
      position: relative;
      box-shadow: 0 24px 48px rgba(0,0,0,0.6), 0 0 0 1px rgba(196,166,93,0.2);
    }
    .stage-inner { position: absolute; inset: 0; transform-origin: top left; width: 1080px; height: 608px; }

    .controls { background: rgba(196,166,93,0.04); border: 1px solid rgba(196,166,93,0.25); padding: 22px; }
    .controls h2 { margin: 0 0 14px; font-family: 'Black Ops One', sans-serif; font-size: 16px; letter-spacing: 0.15em; color: #ff7a1a; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 10px; letter-spacing: 0.25em; color: rgba(196,166,93,0.7); text-transform: uppercase; }
    .field input { background: #0a0d07; border: 1px solid rgba(196,166,93,0.3); color: #fff8e8; padding: 8px 10px; font-family: 'Share Tech Mono', monospace; font-size: 13px; letter-spacing: 0.05em; }
    .field input:focus { outline: none; border-color: #ff7a1a; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .note { margin-top: 18px; padding: 14px; background: rgba(255,122,26,0.06); border: 1px dashed rgba(255,122,26,0.4); font-size: 12px; line-height: 1.6; color: rgba(244,231,200,0.85); }
    .note b { color: #ff7a1a; letter-spacing: 0.2em; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="h1">SOL<b>SHOT</b> · TROPHY SHARE CARD <span style="opacity:0.5;font-size:13px">Satori-ready · 1080×608</span></div>
      <div class="meta">POST-MATCH · TWITTER 1.91:1</div>
    </div>

    <div class="grid">
      <div class="stage">
        <div id="frame" class="stage-frame">
          <div id="inner" class="stage-inner">
            <div id="root" style="width:1080px;height:608px;"></div>
          </div>
        </div>
      </div>

      <div class="controls">
        <h2>LIVE PROPS</h2>
        <div class="field"><label>Winner callsign</label><input id="w_call" value="GRIZZLY-07" /></div>
        <div class="row3">
          <div class="field"><label>DMG</label><input id="w_dmg" value="742" /></div>
          <div class="field"><label>ACC %</label><input id="w_acc" value="68" /></div>
          <div class="field"><label>Shots</label><input id="w_shots" value="22" /></div>
        </div>
        <div class="field"><label>MVP weapon</label><input id="w_best" value="CRAZY IVAN" /></div>
        <div class="field"><label>Loser callsign</label><input id="l_call" value="VIPER-12" /></div>
        <div class="row2">
          <div class="field"><label>Score</label><input id="score" value="2 – 1" /></div>
          <div class="field"><label>Match ID</label><input id="mid" value="M-#0A3F7" /></div>
        </div>
        <div class="row2">
          <div class="field"><label>Terrain</label><input id="terrain" value="VOLCANIC" /></div>
          <div class="field"><label>Duration</label><input id="dur" value="08:42" /></div>
        </div>
        <div class="note">
          <b>NOTE:</b> The component file (<code style="color:#fff8e8">TrophyShareCard.jsx</code>) is identical here and on the server. JSX renders both in the browser DOM and in Satori on Node — no clip-path, no backdrop-filter, no grid.
        </div>
      </div>
    </div>
  </div>

  <script type="text/babel" data-presets="env,react">
    const { useEffect, useState } = React;

    /* ── Inline mirror of TrophyShareCard.jsx ── */
    const C = {
      bgDeep:'#0e1209', bgDeeper:'#0a0d07', ink:'#06080a',
      accent:'#ff7a1a', accentDeep:'#c44d12', accentSoft:'#ffb05a',
      bone:'#fff8e8', bonePale:'#f4e7c8', olive:'#c4a65d',
      oliveDim:'rgba(196,166,93,0.6)',
    };
    const F = {
      display:"'Black Ops One', sans-serif",
      mono:"'Share Tech Mono', monospace",
    };

    function Spacer() { return <div style={{ width:16, flexShrink:0 }} />; }

    function TrophyStat({ label, v, sub }) {
      return (
        <div style={{
          flexGrow:1, flexBasis:0,
          display:'flex', flexDirection:'column',
          background:'rgba(10,13,7,0.85)',
          border:'1px solid rgba(255,176,90,0.4)',
          padding:'16px 20px',
        }}>
          <div style={{ fontFamily:F.mono, fontSize:11, color:C.olive, letterSpacing:'0.3em', marginBottom:6 }}>{label}</div>
          <div style={{ display:'flex', fontFamily:F.display, fontSize:48, color:C.bone, lineHeight:0.95, letterSpacing:'0.02em', whiteSpace:'nowrap', overflow:'hidden' }}>{v}</div>
          <div style={{ fontFamily:F.mono, fontSize:11, color:'rgba(244,231,200,0.5)', letterSpacing:'0.25em', marginTop:4 }}>{sub}</div>
        </div>
      );
    }

    function TrophyShareCard({ winner, loser, score, matchId, terrain, duration }) {
      const w = 1080, h = 608;
      return (
        <div style={{ width:w, height:h, position:'relative', background:C.bgDeep, display:'flex', overflow:'hidden' }}>
          <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ position:'absolute', left:0, top:0 }}>
            <defs>
              <pattern id="trophy-grid" width="32" height="32" patternUnits="userSpaceOnUse">
                <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(196,166,93,0.08)" strokeWidth="1" />
              </pattern>
              <linearGradient id="trophy-blade" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stopColor={C.accent} />
                <stop offset="100%" stopColor={C.accentDeep} />
              </linearGradient>
              <pattern id="trophy-scan" width="3" height="3" patternUnits="userSpaceOnUse">
                <rect width="3" height="1" fill="rgba(0,0,0,0.18)" />
              </pattern>
            </defs>
            <rect width={w} height={h} fill="url(#trophy-grid)" />
            <polygon points={`0,${h} 0,${h*0.55} ${w*0.62},0 ${w},0 ${w},${h*0.18} ${w*0.42},${h}`} fill="url(#trophy-blade)" opacity="0.95" />
            <rect width={w} height={h} fill="url(#trophy-scan)" />
          </svg>

          <div style={{ position:'absolute', left:56, right:56, top:32, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
            <div style={{ display:'flex', fontFamily:F.display, fontSize:32, color:C.bonePale, letterSpacing:'0.08em' }}>
              <span>SOL</span><span style={{ color:C.accentSoft }}>SHOT</span>
            </div>
            <div style={{ fontFamily:F.mono, fontSize:13, letterSpacing:'0.35em', color:'rgba(244,231,200,0.6)' }}>MATCH · {matchId}</div>
          </div>

          <div style={{
            position:'absolute', left:56, top:110, width:200, height:200,
            background:C.bgDeep, border:`4px solid ${C.accentSoft}`,
            display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column',
          }}>
            <div style={{ display:'flex', fontFamily:F.display, fontSize:140, color:C.accentSoft, lineHeight:0.8, textShadow:'0 0 30px rgba(255,176,90,0.5)' }}>W</div>
            <div style={{ fontFamily:F.mono, fontSize:13, color:C.bonePale, letterSpacing:'0.3em', opacity:0.7, marginTop:8 }}>VICTORY</div>
          </div>

          <div style={{ position:'absolute', left:290, top:130, right:56, display:'flex', flexDirection:'column' }}>
            <div style={{ fontFamily:F.mono, fontSize:14, letterSpacing:'0.4em', color:'rgba(255,255,255,0.7)', marginBottom:8 }}>OPERATIVE</div>
            <div style={{ display:'flex', fontFamily:F.display, fontSize:110, lineHeight:0.9, color:C.bone, letterSpacing:'0.02em', textShadow:'0 4px 0 rgba(0,0,0,0.4)', whiteSpace:'nowrap', overflow:'hidden' }}>{winner.callsign}</div>
            <div style={{ display:'flex', alignItems:'center', fontFamily:F.mono, fontSize:16, letterSpacing:'0.25em', color:'rgba(255,255,255,0.85)', marginTop:14 }}>
              <span>DEFEATED</span>
              <span style={{ color:C.bone, marginLeft:10 }}>{loser.callsign}</span>
              <span style={{ margin:'0 14px', opacity:0.4 }}>|</span>
              <span style={{ display:'flex', fontFamily:F.display, fontSize:28, color:C.bgDeep, background:C.bone, padding:'2px 12px', letterSpacing:'0.04em' }}>{score}</span>
            </div>
          </div>

          <div style={{ position:'absolute', left:56, right:56, bottom:88, display:'flex', flexDirection:'row' }}>
            <TrophyStat label="DMG DEALT" v={String(winner.damage)} sub="HP" />
            <Spacer />
            <TrophyStat label="ACCURACY" v={`${winner.accuracy}%`} sub={`${winner.shots} SHOTS`} />
            <Spacer />
            <TrophyStat label="MVP WEAPON" v={winner.best} sub="SIGNATURE" />
          </div>

          <div style={{
            position:'absolute', left:0, right:0, bottom:0, height:56,
            background:C.bgDeeper, borderTop:`2px solid ${C.accentSoft}`,
            display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 56px',
          }}>
            <div style={{ fontFamily:F.mono, fontSize:13, color:C.olive, letterSpacing:'0.3em' }}>SOLSHOT.GG · ARTILLERY COMBAT ON SOLANA</div>
            <div style={{ fontFamily:F.mono, fontSize:13, color:C.oliveDim, letterSpacing:'0.3em' }}>▸ TERRAIN {terrain} · {duration}</div>
          </div>
        </div>
      );
    }

    function App() {
      const [props, setProps] = useState({
        winner:{ callsign:'GRIZZLY-07', damage:742, accuracy:68, shots:22, best:'CRAZY IVAN' },
        loser:{ callsign:'VIPER-12' },
        score:'2 – 1', matchId:'M-#0A3F7', terrain:'VOLCANIC', duration:'08:42',
      });

      useEffect(() => {
        const fit = () => {
          const fr = document.getElementById('frame');
          const inner = document.getElementById('inner');
          if (!fr || !inner) return;
          inner.style.transform = `scale(${fr.clientWidth / 1080})`;
        };
        fit();
        window.addEventListener('resize', fit);

        const wire = (id, cb) => document.getElementById(id).addEventListener('input', e => cb(e.target.value));
        wire('w_call',  v => setProps(p => ({ ...p, winner: { ...p.winner, callsign: v }})));
        wire('w_dmg',   v => setProps(p => ({ ...p, winner: { ...p.winner, damage: Number(v) || 0 }})));
        wire('w_acc',   v => setProps(p => ({ ...p, winner: { ...p.winner, accuracy: Number(v) || 0 }})));
        wire('w_shots', v => setProps(p => ({ ...p, winner: { ...p.winner, shots: Number(v) || 0 }})));
        wire('w_best',  v => setProps(p => ({ ...p, winner: { ...p.winner, best: v }})));
        wire('l_call',  v => setProps(p => ({ ...p, loser:  { ...p.loser,  callsign: v }})));
        wire('score',   v => setProps(p => ({ ...p, score: v })));
        wire('mid',     v => setProps(p => ({ ...p, matchId: v })));
        wire('terrain', v => setProps(p => ({ ...p, terrain: v })));
        wire('dur',     v => setProps(p => ({ ...p, duration: v })));

        return () => window.removeEventListener('resize', fit);
      }, []);

      return <TrophyShareCard {...props} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
