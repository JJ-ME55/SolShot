[package]
name = "solshot-escrow-v2"
version = "0.1.0"
description = "SolShot N-player (2-10) async/idle match escrow — fee snapshot at create, public timeout refund, configurable per-match duration up to 7d"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solshot_escrow_v2"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
