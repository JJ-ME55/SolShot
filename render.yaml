# Render deployment config for SolShot server
# Deploy: Connect GitHub repo → Render detects this file automatically
#
# After connecting repo, set these SECRET env vars in the Render dashboard:
#   SOLANA_KEYPAIR_JSON  — paste contents of solshot-dev.json (the JSON byte array)
#   JWT_SECRET           — auto-generated below, or set your own
#   MONGODB_URI          — from MongoDB Atlas (optional for devnet testing)

services:
  - type: web
    name: solshot-server
    runtime: node
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SOLANA_RPC
        value: https://api.devnet.solana.com
      - key: MATCH_ESCROW_PROGRAM_ID
        value: CqvRC6mSJe2CrBtENVfCEPkgRW3WwxLSL9C1hgXz7GtD
      - key: SHOT_TOKEN_MINT
        value: 4NnYBycLLo8acgbkLz2SyCXd3KU8jgHQLEmrVypi5VLd
      - key: TREASURY_WALLET
        value: 4Ekd8xxsym6HiGaKbDVP7hgf3AoBsLmBSenyfx3N2hGk
      - key: OPS_WALLET
        value: G2TgxypFAQHvcfwRA1dkJMx2St4gYpDpz37uiG1Q9grx
      - key: CORS_ORIGINS
        value: https://solshot.gg,https://www.solshot.gg,https://solshot-client.vercel.app
      - key: JWT_SECRET
        generateValue: true
      # Set these manually in dashboard (secrets — don't commit):
      # - SOLANA_KEYPAIR_JSON  (paste the raw JSON array from solshot-dev.json)
      # - MONGODB_URI          (from Atlas, or omit for no persistence)
    healthCheckPath: /health
    autoDeploy: true
