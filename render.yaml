# Render deployment config for SolShot server
# Deploy: Connect GitHub repo → Render detects this file automatically
#
# After connecting repo, these secrets are prompted during Blueprint setup (sync: false):
#   SOLANA_KEYPAIR_JSON  — server authority keypair (JSON byte array)
#   ADMIN_API_KEY        — for /api/admin/reload-keys endpoint
#   MONGODB_URI          — from MongoDB Atlas

services:
  - type: web
    name: solshot-server
    runtime: node
    region: oregon
    plan: starter
    rootDir: server
    buildCommand: npm ci --ignore-scripts
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SOLANA_RPC
        value: https://api.devnet.solana.com
      - key: MATCH_ESCROW_PROGRAM_ID
        value: CqvRC6mSJe2CrBtENVfCEPkgRW3WwxLSL9C1hgXz7GtD
      - key: SHOT_TOKEN_MINT
        value: 4NnYBycLLo8acgbkLz2SyCXd3KU8jgHQLEmrVypi5VLd
      - key: TREASURY_WALLET
        value: 4Ekd8xxsym6HiGaKbDVP7hgf3AoBsLmBSenyfx3N2hGk
      - key: OPS_WALLET
        value: G2TgxypFAQHvcfwRA1dkJMx2St4gYpDpz37uiG1Q9grx
      - key: CORS_ORIGINS
        value: https://solshot.gg,https://www.solshot.gg,https://sol-shot.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: SOLANA_KEYPAIR_JSON
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
    healthCheckPath: /health
    autoDeploy: true
